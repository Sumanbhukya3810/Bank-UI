    <title>Bank Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" integrity="sha512-xbVTHH7rhqDGc8u1q9L98fAtEM/wWEf4hdZ8VTJf2MzwvlYY4Ay+DhMHNWmQJyE96D3DO/d1nI1Zj4iXmNEn0g==" crossorigin="anonymous" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('https://example.com/your-background-image.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
        }

        .navbar {
            background-color: rgba(0, 123, 255, 0.8); /* Slightly transparent */
            color: #fff;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-link {
            color: #fff;
            font-weight: bold;
        }

        .welcome-line {
            font-size: 28px;
            font-weight: bold;
            margin-top: 30px;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        .container {
            background: rgba(255, 255, 255, 0.9); /* Slightly transparent white */
            border: 2px solid #007bff; /* Blue border */
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        /* Responsive styling */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 15px;
            }
            .navbar-brand {
                font-size: 20px;
            }
            .nav-link {
                margin-right: 10px;
            }
            .welcome-line {
                font-size: 24px;
                margin-top: 20px;
            }
            .container {
                padding: 1rem;
                border-width: 1px;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
